[project]
name = "utterscope"
version = "0.3.0"
description = "Local-first speaking analysis CLI for language learners"
authors = [
    { name = "Ryuuga-89", email = "eyesharp06@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.24.0",
    "jinja2>=3.1.6",
    "onnxruntime>=1.30.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "rich>=13.0",
    "silero-vad>=6.2.2",
    "typer>=0.12",
    "whispermlx>=3.13.1",
]

[project.scripts]
utterscope = "utterscope.cli.app:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"
